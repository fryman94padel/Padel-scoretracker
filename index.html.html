<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102331"><title>Padel Scorekeeper v1.1</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f9fb;background:#102331}*{box-sizing:border-box}body{margin:0;padding:18px;min-height:100vh}.app{max-width:560px;margin:auto}h1{font-size:1.5rem;margin:0 0 8px}.sub{color:#aec0ca;margin:0 0 20px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{background:#1e3848;border-radius:16px;padding:16px 10px;text-align:center}.team input{width:100%;background:transparent;border:0;border-bottom:1px solid #607685;color:white;text-align:center;font:600 1rem system-ui;padding:5px}.points{font-size:3.6rem;font-weight:800;margin:18px 0;color:#b9f46a}.score{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;margin:16px 0}.stat{background:#1e3848;border-radius:12px;padding:12px}.stat strong{display:block;font-size:1.8rem}.stat small{color:#aec0ca}.score button,.actions button{width:100%;border:0;border-radius:12px;padding:17px 8px;font:700 1rem system-ui;cursor:pointer}.score button{background:#b9f46a;color:#102331}.actions{display:flex;gap:12px;margin-top:18px}.actions button{background:#345366;color:white}.status{text-align:center;margin:18px 0;color:#e5edf2;min-height:2.8em}.sets{text-align:center;background:#1e3848;padding:12px;border-radius:12px;margin-top:12px}.sets span{color:#b9f46a;font-weight:800}.note{text-align:center;color:#aec0ca;font-size:.8rem;margin-top:18px}
</style></head><body><main class="app"><h1>🎾 Padel Scorekeeper</h1><p class="sub">Tap the team that wins each point.</p><div class="teams"><section class="team"><input id="name0" aria-label="Team one name" value="Ryan & Beth"><div class="points" id="point0">0</div></section><section class="team"><input id="name1" aria-label="Team two name" value="Opponents"><div class="points" id="point1">0</div></section></div><div class="score"><div class="stat"><small>GAMES</small><strong id="game0">0</strong></div><div class="stat"><small>GAMES</small><strong id="game1">0</strong></div><button onclick="award(0)">+ Point Team 1</button><button onclick="award(1)">+ Point Team 2</button></div><div class="sets">Sets won: <span id="sets">0 – 0</span><div id="history"></div></div><div class="status" id="status">First to two sets wins.</div><div class="actions"><button onclick="undo()">↶ Undo</button><button onclick="newMatch()">New match</button></div><p class="note">Standard advantage scoring · Tie-break at 6–6 · Best of 3 sets</p></main><script>
const KEY='padel-scorekeeper-v1';const fresh=()=>({points:[0,0],games:[0,0],sets:[0,0],history:[],tiebreak:false,finished:false,names:['Ryan & Beth','Opponents']});let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}let past=[];function save(){localStorage.setItem(KEY,JSON.stringify(state))}function winGame(i){state.games[i]++;state.points=[0,0];if(state.games[i]===6&&state.games[1-i]===6)state.tiebreak=true;if(state.games[i]>=6&&state.games[i]-state.games[1-i]>=2||state.games[i]===7){winSet(i)}}function winSet(i){state.history.push([...state.games]);state.sets[i]++;state.games=[0,0];state.points=[0,0];state.tiebreak=false;if(state.sets[i]===2)state.finished=true}function award(i){if(state.finished)return;past.push(structuredClone(state));let other=1-i;state.points[i]++;if(state.tiebreak){if(state.points[i]>=7&&state.points[i]-state.points[other]>=2){state.games[i]++;winSet(i)}}else if(state.points[i]>=4&&state.points[i]-state.points[other]>=2){winGame(i)}save();render()}function undo(){if(!past.length)return;state=past.pop();save();render()}function newMatch(){if(!confirm('Start a new match? This resets the current score.'))return;let names=[...state.names];state=fresh();state.names=names;past=[];save();render()}function render(){for(let i=0;i<2;i++){document.getElementById('name'+i).value=state.names[i];document.getElementById('game'+i).textContent=state.games[i]}let p=state.points;let labels=['0','15','30','40'];const deucePhase=!state.tiebreak&&p[0]>=3&&p[1]>=3;const advantageTeam=deucePhase&&p[0]!==p[1]?(p[0]>p[1]?0:1):-1;for(let i=0;i<2;i++){let value=state.tiebreak?String(p[i]):deucePhase?(advantageTeam===i?'AD':'40'):labels[Math.min(p[i],3)];document.getElementById('point'+i).textContent=value}document.getElementById('sets').textContent=state.sets.join(' – ');document.getElementById('history').textContent=state.history.map(g=>g.join('–')).join('  ·  ');document.getElementById('status').textContent=state.finished?`${state.names[state.sets[0]>state.sets[1]?0:1]} win the match! 🏆`:state.tiebreak?'Tie-break: first to 7, win by 2':p[0]>=3&&p[1]>=3&&!state.tiebreak?(p[0]===p[1]?'Deuce':`Advantage ${state.names[p[0]>p[1]?0:1]}`):'First to two sets wins.'}for(let i=0;i<2;i++)document.getElementById('name'+i).addEventListener('change',e=>{state.names[i]=e.target.value.trim()||`Team ${i+1}`;save();render()});render();
</script></body></html>
